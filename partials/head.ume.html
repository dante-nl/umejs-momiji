<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{title}</title>

<!-- Fonts: Atkinson Hyperlegible Next (body) + Mono (headings/code) -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@fontsource/atkinson-hyperlegible-next@5.3.0/400.css"
/>
<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@fontsource/atkinson-hyperlegible-next@5.3.0/700.css"
/>
<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@fontsource-variable/atkinson-hyperlegible-mono@5.3.0/wght.min.css"
/>

<script>
    (function () {
        var stored = sessionStorage.getItem('ume-theme');
        var theme =
            stored === 'light' || stored === 'dark'
                ? stored
                : window.matchMedia('(prefers-color-scheme: dark)').matches
                  ? 'dark'
                  : 'light';
        document.documentElement.dataset.theme = theme;
    })();
</script>

<!-- Main styles -->
<link rel="stylesheet" href="{_BASE}/_ume/assets/main.css" />

{themeStyles}

<!-- highlight.js: light theme by default; swapped by JS -->
<link
    rel="stylesheet"
    id="hljs-theme"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css"
/>
