<button class="topbar__menu-toggle" aria-label="Open navigation" aria-expanded="false">
    <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
    >
        <path d="M3 6h18M3 12h18M3 18h18" />
    </svg>
</button>

<a class="topbar__brand" href="/">
    <span class="topbar__logo" aria-hidden="true">◆</span>
    <span class="topbar__title">{siteTitle}</span>
</a>

<nav class="topbar__nav" aria-label="Primary">
    <a href="/docs">Docs</a>
    <a href="/guide">Guide</a>
    <a href="/api">API</a>
</nav>

<div class="topbar__actions">
    <div class="topbar__actions">
        <!-- Replaced input with button -->
        <button class="search-trigger" aria-label="Search documentation">
            <svg
                class="search__icon"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
            >
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.35-4.35" />
            </svg>
            <span class="search-trigger__text">Search…</span>
            <kbd class="search-trigger__kbd">⌘K</kbd>
        </button>
    </div>

    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
        <svg
            class="theme-toggle__sun"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
        >
            <circle cx="12" cy="12" r="5" />
            <path
                d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
            />
        </svg>
        <svg
            class="theme-toggle__moon"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
        >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
    </button>
</div>
